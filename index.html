<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar IA · Nivelamento</title>
  <meta name="description" content="Pesquisa interativa de nivelamento em Inteligência Artificial e Automação.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="grid"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">◆</span><span>Radar<b>IA</b></span></div>
    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="dim-track" id="dimTrack"></div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="counter" id="counter"></div>
  </header>

  <main class="shell">
    <div id="stage" class="stage" aria-live="polite"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
